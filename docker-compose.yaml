services:

  postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: modular_monolith
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ==========================================
  # OPENTELEMETRY COLLECTOR
  # ==========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    environment:
      SERVICE_NAME: ecommerce-api
      ENVIRONMENT: development

    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      # OTLP gRPC
      - "4317:4317"

      # OTLP HTTP
      - "4318:4318"

      # Prometheus metrics
      - "8889:8889"

      # Health check
      - "13133:13133"

    depends_on:
      - tempo
      - loki
      - elasticsearch

    restart: unless-stopped

  # ==========================================
  # TEMPO
  # ==========================================
  tempo:
    image: grafana/tempo:2.8.2
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

    ports:
      # Tempo HTTP API
      - "3200:3200"

      # OTLP gRPC
      - "4320:4317"

    restart: unless-stopped

  # ==========================================
  # LOKI
  # ==========================================
  loki:
    image: grafana/loki:latest
    container_name: ecommerce-loki

    command:
      - "-config.file=/etc/loki/loki.yml"

    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

    ports:
      - "3100:3100"

    restart: unless-stopped

  # ==========================================
  # PROMETHEUS
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ==========================================
  # ELASTICSEARCH
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.3
    container_name: ecommerce-elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    restart: unless-stopped

  # ==========================================
  # KIBANA
  # ==========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.16.3
    container_name: ecommerce-kibana

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: kibana
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "min-32-byte-long-strong-encryption-key-for-kibana"

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:5601/api/status || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: unless-stopped

  # ==========================================
  # GRAFANA
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
      - prometheus
      - loki
    restart: unless-stopped


volumes:
  postgres_data:
  tempo_data:
  loki_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data: